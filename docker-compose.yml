version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - API_DEBUG=False
      - FLASK_ENV=production
    volumes:
      - ./src:/app/src
      - ./models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  default:
    name: taxi-predict-network
